<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần mềm xử lý dữ liệu</title>
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung bao ngoài cùng (Tương ứng với viền ngoài của hình vẽ) */
        .main-card {
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Ô tiêu đề ở trên cùng */
        .header-box {
            border: 3px solid #000000;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: center;
            background-color: #fff;
        }

        .header-box h1 {
            font-size: 24px;
            color: #111;
            font-weight: 600;
            letter-spacing: 1px;
            /* text-transform: lowercase; */
            /* Hoặc bỏ dòng này nếu muốn chữ hoa */
        }

        /* Lưới 4 ô màu đỏ (2x2) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            /* 2 cột trên máy tính/màn hình rộng */
            gap: 25px;
        }

        /* Các ô truy cập màu đỏ */
        .sub-card {
            background-color: goldenrod;
            border: 3px solid #000000;
            border-radius: 10px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 140px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Hiệu ứng di chuột vào ô */
        .sub-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 42, 42, 0.3);
            background-color: brown;
        }

        /* Tiêu đề của từng ô con */
        .sub-card .card-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* Nút thao tác (Action Button) bên trong mỗi ô */
        .sub-card .action-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            border: 2px solid #000000;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .sub-card .action-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        /* RESPONSIVE: Tự động chuyển thành 1 cột trên màn hình điện thoại (< 600px) */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .main-card {
                padding: 20px 15px;
                gap: 25px;
            }

            .header-box h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Khung chính ngoài cùng -->
    <div class="main-card">

        <!-- Ô Tiêu đề -->
        <div class="header-box">
            <h1>Website xử lý dữ liệu HYWACO</h1>
        </div>

        <!-- Khung chứa 4 ô truy cập màu đỏ -->
        <div class="grid-container">

            <!-- Ô 1 -->
            <div class="sub-card">
                <div class="card-title">Thống kê chỉ số</div>
                <a href="./thongkechiso.html" class="action-btn">Truy cập</a>
            </div>

            <!-- Ô 2 -->
            <div class="sub-card">
                <div class="card-title">Thống kê sản lượng</div>
                <a href="trang2.html" class="action-btn">Truy cập</a>
            </div>

            <!-- Ô 3 -->
            <div class="sub-card">
                <div class="card-title">Đang phát triển</div>
                <a href="trang3.html" class="action-btn">Truy cập</a>
            </div>

            <!-- Ô 4 -->
            <div class="sub-card">
                <div class="card-title">Đang phát triển</div>
                <a href="trang4.html" class="action-btn">Truy cập</a>
            </div>

        </div>

    </div>

</body>

</html>
